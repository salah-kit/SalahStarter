name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# An explicit `bash` runs every step with `-eo pipefail`. GitHub's default shell omits pipefail,
# so a failing command piped into another would pass the step.
defaults:
  run:
    shell: bash

jobs:
  app:
    name: Build and test (iPhone simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false

      # The newest Xcode 26 on the image. The project also builds with Xcode 27.
      - name: Select the newest Xcode 26
        run: scripts/select-xcode.sh

      # The committed project must be exactly what project.yml generates (STANDARD.md, Apps).
      # XcodeGen is pinned by version and checksum, so its output can't drift. `git status`
      # also catches generated files that were never committed.
      - name: Check the generated project
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${RUNNER_TEMP}/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/xcodegen/bin/xcodegen" --quiet
          changes="$(git status --porcelain)"
          if [[ -n "${changes}" ]]; then
            echo "${changes}"
            git diff
            echo "::error::The project differs from what project.yml generates. Run xcodegen and commit both."
            exit 1
          fi

      # The app and the widget extension build under both default-isolation settings. The
      # project's APP_DEFAULT_ISOLATION reaches only the app's own targets: passing
      # SWIFT_DEFAULT_ACTOR_ISOLATION here would also make SalahTimes' types main-actor-isolated.
      - name: Build (MainActor and nonisolated)
        run: |
          for isolation in MainActor nonisolated; do
            echo "::group::${isolation}"
            xcodebuild build-for-testing \
              -project SalahStarter.xcodeproj -scheme SalahStarter \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ".derived/${isolation}" \
              APP_DEFAULT_ISOLATION="${isolation}" CODE_SIGNING_ALLOWED=NO
            echo "::endgroup::"
          done

      # The unit tests and the journeys need an iPhone simulator. The runner's images name them
      # differently over time, so the step picks the first available iPhone; without one, the
      # job stays build-only and says so (STANDARD.md, CI).
      #
      # The Home Screen journey (HomeScreenJourney) skips itself here: it adds the widget through
      # Springboard's editing screens and waits for WidgetKit to run the real extension, which a
      # cold hosted simulator doesn't do on a schedule a pull request should depend on. It runs
      # on a local simulator; CONTRIBUTING.md says how. TEST_RUNNER_ variables reach the test
      # runner with the prefix removed.
      - name: Unit tests and journeys on an iPhone simulator
        env:
          TEST_RUNNER_SALAHSTARTER_SKIP_HOME_SCREEN: "1"
        run: |
          udid="$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -n 1 \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' || true)"
          if [[ -z "${udid}" ]]; then
            echo "::warning::No iPhone simulator is available on this runner; the app is build-only here."
            exit 0
          fi
          xcrun simctl list devices available | grep "${udid}"
          xcodebuild test \
            -project SalahStarter.xcodeproj -scheme SalahStarter \
            -destination "id=${udid}" \
            -derivedDataPath .derived/test \
            -resultBundlePath .derived/SalahStarter.xcresult

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          name: SalahStarter.xcresult
          path: .derived/SalahStarter.xcresult
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the toolchain contributors format with locally (Swift 6.4), so the formatter's
    # output doesn't change under a pull request when swift:latest moves.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false
      - name: swift format lint
        run: scripts/lint.sh
